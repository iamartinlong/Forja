name: Docs (GitHub Pages)

on:
  # 快照为孤儿提交 + 强制推送：paths 过滤在无共同祖先时不可靠，故不加 paths，任何 main 推送都重建站点
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-docs/package-lock.json
      - name: Install deps
        working-directory: site-docs
        run: npm ci
      - name: "Build (public build: 排除内部运维手册)"
        working-directory: site-docs
        env:
          DOCS_BASE: /Forja/
          DOCS_PUBLIC: "1"
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
